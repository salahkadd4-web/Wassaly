name: wassaly
description: "Wassaly - mise en relation clients et livreurs de proximite en Algerie."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  intl: ^0.20.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/branding/logo/
