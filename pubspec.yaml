name: wassaly
description: "Wassaly - mise en relation clients et livreurs de proximite en Algerie."
publish_to: 'none'

version: 1.3.0+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: any # notifications push (version compatible choisie par pub)
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  http: ^1.2.2
  cloud_functions: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/branding/logo/

  # Readex Pro (SIL Open Font License, assets/fonts/OFL.txt) : latin + arabe,
  # embarquee pour ne dependre d'aucun telechargement au demarrage.
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
